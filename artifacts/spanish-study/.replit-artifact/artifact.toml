kind = "web"
previewPath = "/"
title = "Spanish Study App"
version = "1.0.0"
id = "artifacts/spanish-study"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22746

[services.development]
run = "pnpm --filter @workspace/spanish-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spanish-study", "run", "build" ]
publicDir = "artifacts/spanish-study/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22746"
BASE_PATH = "/"
